services:
  payloadweaver:
    build:
      context: .
      dockerfile: Dockerfile
    image: payloadweaver:latest
    container_name: payloadweaver
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-5000}
      FLASK_DEBUG: "false"
      ZAP_PROXY_URL: http://127.0.0.1:${ZAP_PORT:-8080}
      ZAP_PORT: ${ZAP_PORT:-8080}
      ZAP_DISABLE_KEY: ${ZAP_DISABLE_KEY:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - payloadweaver-instance:/app/instance
      - payloadweaver-reports:/app/static/reports

volumes:
  payloadweaver-instance:
  payloadweaver-reports:
