{% extends "base_modern.html" %}

{% block title %}Login | PayloadWeaver{% endblock %}

{% block content %}
<section class="content-grid">
    <article class="card" style="max-width: 560px; width: 100%; margin: 0 auto;">
        <div class="eyebrow">Account Access</div>
        <h1>Sign in</h1>
        <p class="subtext">Open the scanner workspace, manage reports, and continue your security review flow.</p>

        <form action="/login" method="POST" style="margin-top: 24px;">
            <label for="email">
                Email address
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </label>
            <label for="password">
                Password
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </label>
            <button type="submit" class="primary">Login</button>
        </form>

        <p class="subtext" style="margin-top: 16px;">
            Don’t have an account? <a href="{{ url_for('register') }}" style="color: var(--primary);">Create one here</a>.
        </p>
    </article>
</section>
{% endblock %}
