[supervisord]
nodaemon=true

[program:zap]
command=/bin/bash -c "export JAVA_OPTS='-Xms256m -Xmx768m' && /zap/zap.sh -daemon -host 0.0.0.0 -port ${ZAP_PORT:-8080} -config api.disablekey=${ZAP_DISABLE_KEY:-false} -config api.key=${ZAP_API_KEY:-}"
autostart=true
autorestart=true
stderr_logfile=/var/log/zap.err.log
stdout_logfile=/var/log/zap.out.log

[program:flask]
command=/bin/bash -c "/usr/local/bin/gunicorn --bind 0.0.0.0:${PORT:-5000} --workers ${GUNICORN_WORKERS:-1} --timeout ${GUNICORN_TIMEOUT:-180} app:app"
autostart=true
autorestart=true
stderr_logfile=/var/log/flask.err.log
stdout_logfile=/var/log/flask.out.log